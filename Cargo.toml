[package]
name = "website"
version = "0.1.0"
authors = ["Hell HBBD <paulyu602@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
dioxus = { version = "0.7.2", features = ["fullstack"] }
dioxus-router = "0.7.2"
futures-util = { version = "0.3.31" }
gloo-timers = { version = "0.3.0", features = ["futures"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
uuid = { version = "1.19.0", features = ["v4", "js", "serde"] }
web-sys = { version = "0.3.83", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlDetailsElement",
    "Location",
    "MouseEvent",
    "Node",
    "TouchEvent",
    "TouchList",
    "Touch",
    "Performance",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "sync"] }

[features]
default = ["web", "server"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
# The feature that are only required for the server = ["dioxus/server"] build target should be optional and only enabled in the server = ["dioxus/server"] feature
server = ["dioxus/server"]

[dev-dependencies]
tower = "0.5.2"
